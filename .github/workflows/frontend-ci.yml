name: Frontend CI

# NOTE: this repo's branches are `master` (default) and `development`.
# The original filter was `[main]`, which does not exist here — so no run
# ever fired and the README badges stayed grey.
on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      # NEXT_PUBLIC_* vars are inlined at build time. These match
      # scripts/generate-env.sh so the CI build mirrors a local one.
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_FASTAPI_BACKEND_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the runtime used by frontend/Dockerfile (node:20-alpine).
          node-version: 20
          cache: npm
          # The dashboard lives in `frontend/`; the old path pointed at the
          # removed `dashboard/` directory.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
