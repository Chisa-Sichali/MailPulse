services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailpulse
      POSTGRES_PASSWORD: mailpulse
      POSTGRES_DB: mailpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mailpulse -d mailpulse" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mailpulse:mailpulse@postgres:5432/mailpulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mailpulse:mailpulse@postgres:5432/mailpulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             arq app.workers.settings.WorkerSettings"

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FASTAPI_BACKEND_URL: http://api:8080
        NEXT_PUBLIC_API_URL: http://localhost:3000
    image: mailpulse/dashboard:latest
    container_name: mailpulse-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_FASTAPI_BACKEND_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────────────
  # env-gen — one-shot env generator
  #
  # Usage:
  #   docker compose run --rm env-gen && docker compose up --build
  #
  # Runs scripts/generate-env.sh (mounted from the repo) to fill in every
  # auto-derivable value in backend `.env` and frontend `.env.local` BEFORE
  # compose reads them (env_file values are captured at container creation).
  # Idempotent: never overwrites an existing secret.
  # ───────────────────────────────────────────────────────────────────────────
  env-gen:
    image: alpine:3.20
    working_dir: /app
    environment:
      # Signals to the script that the repo bind-mount below is host-backed,
      # so writing .env / .env.local here is meaningful (not an ephemeral FS).
      ENV_GEN_ALLOWED: "1"
    volumes:
      - .:/app
    entrypoint: ["/bin/sh", "/app/scripts/generate-env.sh"]

volumes:
  postgres_data: