services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mailpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailpulse -d mailpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./deploy/aws/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mailpulse:${POSTGRES_PASSWORD}@postgres:5432/mailpulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/aws/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mailpulse:${POSTGRES_PASSWORD}@postgres:5432/mailpulse
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["${MAILPULSE_PUBLIC_URL}"]'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/aws/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mailpulse:${POSTGRES_PASSWORD}@postgres:5432/mailpulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: arq app.workers.settings.WorkerSettings
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis(host='redis', port=6379).ping()\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${MAILPULSE_PUBLIC_URL}
        NEXT_PUBLIC_FASTAPI_BACKEND_URL: ${MAILPULSE_PUBLIC_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/aws/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard

volumes:
  postgres_data:
  redis_data:
